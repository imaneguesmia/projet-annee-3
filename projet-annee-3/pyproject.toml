[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-nnue-server"
version = "0.1.0"
description = "NNUE server for chess evaluation"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "chess>=1.9.0",
]

[tool.pip]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "chess>=1.9.0",
] 